name: Update Video Playlist

on:
  schedule:
    - cron: '0 0 * * 0'  # 每週日 00:00 UTC（台北時間週日早上 8 點）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate Video/index.html from YouTube playlists
        run: python3 scripts/update_videos.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- Video/index.html; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Video/index.html
          git commit -m "自動更新影片作品集（YouTube 播放清單同步）"
          git push
